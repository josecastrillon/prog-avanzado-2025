server:
  port: 9000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # --- RUTA 1: VEHÍCULOS ---
        - id: vehicle-route
          uri: lb://vehiccle-service
          predicates:
            - Path=/api/vehicles/**

        # --- RUTA 2: REPARACIONES ---
        - id: repair-route
          uri: http://repair-service
          predicates:
            - Path=/api/repairs/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true