server:
  port: 9000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: vehicle-route
          uri: lb://vehicle-service
          predicates:
            - Path=/api/vehicles/**

        - id: repair-route
          uri: lb://repair-service
          predicates:
            - Path=/api/repairs/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
